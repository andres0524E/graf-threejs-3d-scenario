<!DOCTYPE html>
<html lang="en">
<head>
    <title>three.js webgl - FBX loader</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <link type="text/css" rel="stylesheet" href="main.css">
    <style>
        body {
            margin: 0;
            background: transparent;
            overflow: hidden;
        }
        canvas {
            display: block;
            background: transparent !important;
        }
    </style>
</head>

<body>
    <div id="info">
        <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - FBXLoader<br />
        Character and animation from <a href="https://www.mixamo.com/" target="_blank" rel="noopener">Mixamo</a>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "../build/three.module.js",
                "three/addons/": "./jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import Stats from 'three/addons/libs/stats.module.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
        import { EXRLoader } from 'three/addons/loaders/EXRLoader.js';
        import { Audio, AudioListener, AudioLoader } from 'three';

        const manager = new THREE.LoadingManager();
        let camera, scene, renderer, stats, object, loader, guiMorphsFolder;
        let mixer;

        const clock = new THREE.Clock();

        const params = {
            asset: 'Samba Dancing'
        };

        const assets = ['Samba Dancing'];

        init();

        function init() {
            const container = document.createElement('div');
            document.body.appendChild(container);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
            camera.position.set(100, 200, 300);

            scene = new THREE.Scene();

            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 5);
            hemiLight.position.set(0, 200, 0);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 5);
            dirLight.position.set(0, 200, 100);
            dirLight.castShadow = true;
            dirLight.shadow.camera.top = 180;
            dirLight.shadow.camera.bottom = -100;
            dirLight.shadow.camera.left = -120;
            dirLight.shadow.camera.right = 120;
            scene.add(dirLight);

            // Piso transparente
            const mesh = new THREE.Mesh(
                new THREE.PlaneGeometry(2000, 2000),
                new THREE.MeshPhongMaterial({
                    color: 0x000000,
                    transparent: true,
                    opacity: 0,
                    depthWrite: false
                })
            );
            mesh.rotation.x = -Math.PI / 2;
            mesh.receiveShadow = true;
            scene.add(mesh);

            const grid = new THREE.GridHelper(2000, 20, 0x000000, 0x000000);
            grid.material.opacity = 0.2;
            grid.material.transparent = true;
            scene.add(grid);

            loader = new FBXLoader(manager);
            loadAsset(params.asset);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setClearColor(0x000000, 0);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setAnimationLoop(animate);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            const controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 100, 0);
            controls.update();

            window.addEventListener('resize', onWindowResize);

            stats = new Stats();
            container.appendChild(stats.dom);

            const gui = new GUI();
            gui.add(params, 'asset', assets).onChange(function (value) {
                loadAsset(value);
            });

            guiMorphsFolder = gui.addFolder('Morphs').hide();

            // Escenario EXR actualizado
            const exrLoader = new EXRLoader();
            exrLoader.load('models/rgbe/qwantani_sunrise_4k.exr', function (texture) {
                texture.mapping = THREE.EquirectangularReflectionMapping;
                scene.background = texture;
                scene.environment = texture;
            });

            // Música de fondo actualizada
            const listener = new AudioListener();
            camera.add(listener);

            const sound = new Audio(listener);
            const audioLoader = new AudioLoader();
            audioLoader.load('models/rgbe/Lil Baby - Free Stuff Feat Travis Scott (Official Visualizer).mp3', function (buffer) {
                sound.setBuffer(buffer);
                sound.setLoop(true);
                sound.setVolume(0.5);
                sound.play();
            });
        }

        function loadAsset(asset) {
            loader.load('models/fbx/' + asset + '.fbx', function (group) {
                if (object) {
                    object.traverse(function (child) {
                        if (child.material) {
                            const materials = Array.isArray(child.material) ? child.material : [child.material];
                            materials.forEach(material => {
                                if (material.map) material.map.dispose();
                                material.dispose();
                            });
                        }
                        if (child.geometry) child.geometry.dispose();
                    });
                    scene.remove(object);
                }

                object = group;

                if (object.animations && object.animations.length) {
                    mixer = new THREE.AnimationMixer(object);
                    const action = mixer.clipAction(object.animations[0]);
                    action.play();
                } else {
                    mixer = null;
                }

                guiMorphsFolder.children.forEach((child) => child.destroy());
                guiMorphsFolder.hide();

                object.traverse(function (child) {
                    if (child.isMesh) {
                        child.material = new THREE.MeshStandardMaterial({
                            color: new THREE.Color(0xe0ccff),
                            transparent: true,
                            opacity: 0.9,
                            roughness: 0.4,
                            metalness: 0.6,
                            emissive: new THREE.Color(0x9c66ff),
                            emissiveIntensity: 0.2
                        });
                        child.castShadow = true;
                        child.receiveShadow = true;

                        if (child.morphTargetDictionary) {
                            guiMorphsFolder.show();
                            const meshFolder = guiMorphsFolder.addFolder(child.name || child.uuid);
                            Object.keys(child.morphTargetDictionary).forEach((key) => {
                                meshFolder.add(child.morphTargetInfluences, child.morphTargetDictionary[key], 0, 1, 0.01);
                            });
                        }
                    }
                });

                scene.add(object);
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            renderer.render(scene, camera);
            stats.update();
        }
    </script>
</body>
</html>
